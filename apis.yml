name: Ultrahuman
kind: company
description: Ultrahuman makes the Ring AIR and Ring Pro smart rings and the M1 continuous
  glucose monitor (CGM), a subscription-free metabolic-health wearable ecosystem. Its
  Partner (UltraSignal) API lets approved partners read user-consented health metrics -
  sleep, HRV, resting heart rate, skin temperature, SpO2, movement/recovery indexes,
  VO2 max, and (with the M1 patch) continuous glucose - over an OAuth 2.0-secured REST
  API. A separate UltraSignal developer program offers raw sensor streams (PPG,
  temperature, accelerometer) from the Ring AIR via a loaned developer kit. API access
  is not self-serve - partners apply and are onboarded with client credentials; end
  users authorize data sharing from the Ultrahuman app.
